name: Auto Daily Market Report Pipeline

on:
  schedule:
    # 周一至周五美东时间 17:08 自动触发 (夏令时 UTC 21:08，错开整点高峰以保证准时触发执行)
    - cron: '8 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm install

      - name: 运行自动化研报生成流水线
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/auto-daily-report.mjs

      - name: 提交并推送到代码仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "没有新数据变动，跳过推送。"
          else
            git commit -m "chore: auto update daily market report [skip ci]"
            git push
          fi
