name: Auto Daily Market Report Pipeline

on:
  schedule:
    # 周一至周五美东时间 17:18 自动触发；夏令时 UTC 21:18、冬令时 UTC 22:18 各触发一次，
    # 脚本开头按美东时间 17 点守卫去重（仅 schedule 触发时生效，手动触发不受影响），
    # 避开盘中与 17:00 官方结算延迟期，确保获取最终结算收盘价
    - cron: '18 21,22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '是否强制运行（跳过周末/节假日休市检查）'
        required: false
        default: true
        type: boolean
      target_date:
        description: '指定目标日期 (YYYY-MM-DD，留空则自动取当日)'
        required: false
        default: ''
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
       

      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装依赖
        run: |
          npm install

      - name: 运行自动化研报生成流水线
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
        run: |
          node scripts/auto-daily-report.mjs

      - name: 提交并推送到代码仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "没有新数据变动，跳过推送。"
          else
            git commit -m "chore: auto update daily market report"
            git push
          fi
