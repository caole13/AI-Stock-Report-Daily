name: Auto Daily Market Report Pipeline

on:
  schedule:
    # 美东时间周一至周五 17:30 自动运行 (对应 UTC 时间 21:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          npm install

      - name: 运行自动化研报生成流水线
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/auto-daily-report.mjs

      - name: 提交并推送到代码仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff-index --quiet HEAD --; then
            echo "没有新数据变动，跳过推送。"
          else
            git commit -m "chore: auto update daily market report" || exit 0
            git push
          fi
